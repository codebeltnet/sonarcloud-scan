name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Normalizer tests
        shell: pwsh
        working-directory: tooling
        run: |
          dotnet test --project CoverageNormalizer.Tests/CoverageNormalizer.Tests.csproj -c Release -- --minimum-expected-tests 55
          if ($LASTEXITCODE -ne 0) { throw "Normalizer tests failed: $LASTEXITCODE" }
      - name: Action contract and controlled normalized fixture
        shell: pwsh
        run: ./tests/Contract.Tests.ps1
      - name: Default OpenCover Bash contract
        shell: bash
        run: bash ./tests/OpenCover.Tests.sh
